<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trợ lý AI - Test API</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #chat-box { width: 400px; height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; margin-bottom: 10px; border-radius: 5px; background: #f9f9f9;}
        .msg { margin: 5px 0; }
        #user-input { width: 320px; padding: 8px; border: 1px solid #aaa; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h3>Thử nghiệm Trợ lý AI với Google API</h3>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn...">
    <button onclick="sendMessage()">Gửi</button>

    <!-- Import thư viện Gemini từ Google -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <script type="module">
      import { GoogleGenerativeAI } from "@google/generative-ai";

      // Mình đã tích hợp sẵn API Key của bạn vào đây
      const API_KEY = "AQ.Ab8RN6IacNDc1LuoMcS_mMArbflOuhPMFToc6f6z8-jI1cRRPw"; 
      const genAI = new GoogleGenerativeAI(API_KEY);
      
      // Sử dụng mô hình Gemini 1.5 Flash cho tốc độ phản hồi nhanh
      const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

      window.sendMessage = async function() {
          const inputField = document.getElementById("user-input");
          const chatBox = document.getElementById("chat-box");
          const message = inputField.value.trim();
          if(!message) return;

          // Hiển thị tin nhắn người dùng
          chatBox.innerHTML += `<div class="msg"><b>Bạn:</b> ${message}</div>`;
          inputField.value = "";
          chatBox.innerHTML += `<div class="msg" id="loading" style="color: gray;"><i>AI đang gõ...</i></div>`;
          chatBox.scrollTop = chatBox.scrollHeight;

          try {
              // Gọi API lấy câu trả lời
              const result = await model.generateContent(message);
              const response = await result.response;
              const text = response.text();
              
              // Xóa thông báo loading và hiển thị kết quả
              document.getElementById("loading").remove();
              chatBox.innerHTML += `<div class="msg" style="color: #0056b3;"><b>AI:</b> ${text}</div>`;
              chatBox.scrollTop = chatBox.scrollHeight;
          } catch (error) {
              document.getElementById("loading").remove();
              chatBox.innerHTML += `<div class="msg" style="color: red;"><b>Lỗi:</b> ${error.message}</div>`;
          }
      }
    </script>

</body>
</html>
