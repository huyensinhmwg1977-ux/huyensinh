        { id: "1_7", type: "single", question: "Hệ điều hành nào được thiết kế dành riêng cho các thiết bị như iPhone và iPad?", options: ["Hệ điều hành iOS", "Hệ điều hành Android", "Hệ điều hành Windows", "Hệ điều hành Ubuntu"], correct: 0, explanation: "iOS là hệ điều hành di động độc quyền của Apple dành cho hệ sinh thái di động của họ." },
        { id: "1_8", type: "single", question: "So với máy tính cá nhân, hệ điều hành di động sử dụng phương thức giao tiếp chủ yếu nào?", options: ["Gõ các dòng lệnh thông qua bàn phím vật lí", "Vuốt, chạm, lắc thông qua màn hình cảm ứng", "Điều hướng qua một con trỏ chuột không dây", "Sử dụng hoàn toàn qua trợ lí nhận dạng giọng nói"], correct: 1, explanation: "Thiết bị di động dựa chủ yếu vào thao tác cảm ứng trực tiếp trên màn hình." },
        { id: "1_9", type: "single", question: "Hệ điều hành đóng vai trò là \"môi trường trung gian\" giúp kết nối hai thành phần nào?", options: ["Giữa phần cứng máy tính và phần mềm ứng dụng", "Giữa các thiết bị ngoại vi và mạng Internet toàn cầu", "Giữa hệ thống vi xử lí trung tâm và bộ nhớ RAM", "Giữa trình duyệt web và các phần mềm diệt virus"], correct: 0, explanation: "Hệ điều hành đứng giữa và phân bổ tài nguyên phần cứng cho các phần mềm ứng dụng." },
        { id: "1_10", type: "single", question: "Windows phiên bản 95 (ra mắt năm 1995) mang đến cải tiến mang tính đột phá nào?", options: ["Lần đầu tiên tích hợp cơ chế nhận diện tự động Plug & Play", "Lần đầu tiên hỗ trợ kiến trúc vi xử lí 64-bit cho máy tính", "Lần đầu tiên cung cấp giao diện gõ dòng lệnh thay thế đồ hoạ", "Lần đầu tiên được cung cấp dưới dạng mã nguồn mở miễn phí"], correct: 0, explanation: "Win 95 lần đầu tiên tích hợp và làm phổ biến cơ chế Plug & Play (Cắm và chạy)." },
        { id: "1_11", type: "single", question: "Ý nghĩa thực tiễn quan trọng nhất của cơ chế \"Plug & Play\" trên máy tính cá nhân là gì?", options: ["Cho phép phần mềm tự khởi động khi máy tính được cắm nguồn điện", "Giúp người dùng không phải thiết lập các trình điều khiển phần cứng phức tạp", "Giúp kết nối song song hàng chục máy tính lại với nhau thông qua mạng LAN", "Cho phép CPU tự động làm mát phần cứng bằng cách tắt các tiến trình phụ"], correct: 1, explanation: "Plug & Play giải phóng người dùng khỏi việc cài đặt driver thủ công." },
        { id: "1_12", type: "single", question: "Khái niệm \"Cửa sổ\" trong hệ điều hành giao diện đồ hoạ được định nghĩa như thế nào?", options: ["Một vùng hình chữ nhật trên màn hình được phân bổ dành riêng cho một ứng dụng", "Một hộp thoại cảnh báo của hệ thống khi phát hiện có phần mềm mã độc xâm nhập", "Một công cụ tìm kiếm dữ liệu trên Internet tích hợp sẵn bên trong hệ điều hành", "Một biểu tượng nhỏ trên thanh trạng thái biểu thị mức độ kết nối mạng hiện hành"], correct: 0, explanation: "Mỗi tiến trình/ứng dụng sẽ chạy độc lập trong một vùng hình chữ nhật gọi là Window (Cửa sổ)." },
        { id: "1_13", type: "single", question: "Vì sao giao diện đồ hoạ lại được coi là bước tiến lớn thay thế cho giao diện dòng lệnh?", options: ["Vì giao diện đồ hoạ sử dụng cực kì ít tài nguyên của hệ thống bộ nhớ RAM", "Vì tính trực quan cao, giúp người dùng không cần phải học thuộc cú pháp lệnh", "Vì giao diện đồ hoạ có khả năng chặn toàn bộ các cuộc tấn công tin tặc từ xa", "Vì tốc độ thực thi tiến trình của giao diện đồ hoạ luôn nhanh gấp đôi dòng lệnh"], correct: 1, explanation: "GUI dùng hình ảnh thay cho chữ giúp người dùng phổ thông tiếp cận dễ dàng." },
        { id: "1_14", type: "single", question: "Bắt đầu từ phiên bản 3.0, Windows có khả năng \"đa nhiệm\". Đa nhiệm mang lại lợi ích gì?", options: ["Máy tính có thể kết xuất hình ảnh ra nhiều màn hình với độ phân giải siêu cao", "Người dùng có thể khởi chạy và sử dụng nhiều chương trình cùng một thời điểm", "Cho phép hàng trăm người dùng có thể đăng nhập vào một máy tính cùng lúc", "Giúp tăng gấp đôi không gian lưu trữ của mọi ổ đĩa cứng bên trong hệ thống"], correct: 1, explanation: "Multitasking (Đa nhiệm) là chạy song song nhiều tiến trình trên CPU." },
        { id: "1_15", type: "single", question: "Tại sao các hệ điều hành dành cho thiết bị di động lại ưu tiên đặc biệt cho kết nối không dây?", options: ["Do thiết bị di động không có khả năng lắp đặt bất kì cổng kết nối vật lí nào", "Do đặc thù tính chất hay di chuyển, cần kết nối wifi, 3G, 4G, 5G liên tục", "Do các ứng dụng trên di động chỉ chạy được khi có sóng mạng không dây", "Do kết nối mạng không dây tiêu tốn ít dung lượng pin hơn rất nhiều so với cáp"], correct: 1, explanation: "Tính cơ động khiến thiết bị phải thường xuyên thay đổi trạm phát sóng." },
        { id: "1_16", type: "single", question: "Lí do các thiết bị chuyên dụng như lò vi sóng không cần cài đặt hệ điều hành đa năng là gì?", options: ["Vì lò vi sóng có bộ nhớ quá nhỏ, không thể chứa nổi một hệ điều hành cơ bản", "Vì chúng chỉ làm một việc cố định, được điều khiển bằng chương trình ghi sẵn trong ROM", "Vì môi trường nhiệt độ cao của thiết bị sẽ làm hỏng các vi mạch chứa hệ điều hành", "Vì các thiết bị gia dụng không bao giờ cần phải giao tiếp với con người qua màn hình"], correct: 1, explanation: "Các thiết bị đơn nhiệm dùng bộ vi điều khiển nạp ROM cố định thay vì hệ điều hành phức tạp." },
        { id: "1_17", type: "single", question: "Phát biểu nào mô tả đúng nhất sự phụ thuộc của phần mềm ứng dụng vào hệ điều hành?", options: ["Phần mềm ứng dụng tự động kiểm soát và phân bổ điện năng của từng linh kiện", "Phần mềm ứng dụng điều khiển trực tiếp CPU mà không cần thông qua hệ điều hành", "Phần mềm ứng dụng gọi các dịch vụ do hệ điều hành cung cấp để thao tác với phần cứng", "Phần mềm ứng dụng chỉ hoạt động được nếu hệ điều hành tạm thời ngừng mọi hoạt động"], correct: 2, explanation: "Phần mềm muốn dùng phần cứng phải gọi các API (Dịch vụ) từ hệ điều hành." },
        { id: "1_18", type: "single", question: "Trong các nhóm chức năng của hệ điều hành, chức năng \"định dạng đĩa, kiểm tra lỗi đĩa\" thuộc nhóm nào?", options: ["Nhóm cung cấp môi trường giao tiếp với người sử dụng", "Nhóm quản lí việc lưu trữ các tệp tin và thư mục dữ liệu", "Nhóm điều phối tài nguyên cho các tiến trình trên máy", "Nhóm cung cấp tiện ích giúp nâng cao hiệu quả máy tính"], correct: 3, explanation: "Các công cụ dồn đĩa, kiểm tra đĩa là các Tiện ích hệ thống (System Utilities)." },
        { id: "1_19", type: "single", question: "Việc hệ điều hành máy tính cá nhân ưu tiên sự thân thiện, dễ sử dụng được xuất phát từ thực tế nào?", options: ["Đối tượng phục vụ chủ yếu là người dùng phổ thông, không phải các kĩ sư chuyên nghiệp", "Phần cứng máy tính cá nhân quá yếu, không thể gánh vác các giao diện điều khiển phức tạp", "Người dùng máy tính cá nhân chỉ sử dụng duy nhất một phần mềm soạn thảo văn bản", "Các nhà phát triển phần mềm không có khả năng tạo ra hệ điều hành có độ bảo mật cao"], correct: 0, explanation: "Khác với máy chủ, PC dành cho đại chúng nên cần GUI thân thiện, dễ sử dụng." },
        { id: "1_20", type: "single", question: "Đặc tính \"đa người dùng\" của hệ điều hành UNIX được hiểu là khả năng gì?", options: ["Một người có thể tạo ra vô số các tài khoản giả lập trên máy tính của mình", "Nhiều người có thể làm việc và tương tác trên cùng một hệ thống đồng thời", "Hệ điều hành tự động dịch ngôn ngữ cho nhiều quốc gia khác nhau cùng hiểu", "Mọi ứng dụng đều được phép chia sẻ dữ liệu trực tiếp cho toàn bộ cộng đồng"], correct: 1, explanation: "Multi-user cho phép chia sẻ phiên làm việc cho nhiều Terminal/người dùng cùng lúc." },
        { id: "1_21", type: "single", question: "Khi bạn cắm một con chuột không dây mới vào cổng USB của máy tính Windows 11, chuột có thể hoạt động ngay lập tức mà không cần chèn đĩa CD cài đặt. Cơ chế nào đã đảm nhiệm việc này?", options: ["Cơ chế quản lí thư mục hệ thống", "Cơ chế đa nhiệm phần cứng", "Cơ chế tự nhận biết thiết bị Plug & Play", "Cơ chế tối ưu hoá lưu trữ đám mây"], correct: 2, explanation: "Cơ chế Plug & Play tự nhận và cấp driver ảo cho thiết bị." },
        { id: "1_22", type: "single", question: "Bạn muốn thành lập một phòng máy tính thực hành cho học sinh. Để tiết kiệm hoàn toàn chi phí mua bản quyền phần mềm mà vẫn đảm bảo hiệu năng và sự ổn định, bạn nên lựa chọn hệ điều hành nào?", options: ["Hệ điều hành Windows 11 bản quyền", "Hệ điều hành macOS của Apple", "Hệ điều hành mã nguồn mở Ubuntu", "Hệ điều hành thương mại UNIX"], correct: 2, explanation: "Ubuntu là bản phân phối Linux miễn phí, cực kì ổn định." },
        { id: "1_23", type: "single", question: "Một ứng dụng chỉnh sửa ảnh muốn lưu một bức ảnh vừa xuất ra vào ổ đĩa D. Ứng dụng này sẽ phải làm gì để hoàn thành việc lưu tệp?", options: ["Yêu cầu người dùng tự mở mã nguồn đĩa cứng để ghi dữ liệu", "Gọi dịch vụ \"ghi dữ liệu vào tệp\" do hệ điều hành cung cấp", "Trực tiếp phát tín hiệu điện từ điều khiển đầu từ của đĩa cứng", "Xoá một phần mềm khác để lấy chỗ trống ghi bức ảnh đó lên"], correct: 1, explanation: "Phần mềm không thể tự viết vào ổ cứng mà phải gửi yêu cầu (Request) cho HĐH làm." },
        { id: "1_24", type: "single", question: "Khi người dùng điện thoại xoay ngang thiết bị để xem video, video lập tức tự động xoay theo toàn màn hình. Hệ điều hành di động đã sử dụng công cụ phần cứng nào để cung cấp tính năng thân thiện này?", options: ["Tích hợp khả năng nhận dạng cảm biến góc nghiêng/gia tốc", "Quét vị trí đôi mắt người dùng thông qua cụm camera trước", "Đo lường tốc độ kết nối của hệ thống mạng Wifi và 4G", "Thu nhận các dao động âm thanh xung quanh qua micro"], correct: 0, explanation: "HĐH di động quản lý các cảm biến con quay hồi chuyển (gyroscope)." },
        { id: "1_25", type: "single", question: "Nếu một máy tính bị hỏng hoặc mất hoàn toàn hệ điều hành, điều gì sẽ xảy ra khi bạn cố gắng mở một phần mềm trò chơi có sẵn trên ổ cứng?", options: ["Trò chơi vẫn chạy bình thường nhưng hình ảnh sẽ bị mờ đi một chút", "Máy tính tự động chạy một hệ điều hành phụ từ màn hình máy tính", "Không thể chạy được trò chơi do thiếu môi trường trung gian kết nối phần cứng", "Trò chơi sẽ chạy trên nền giao diện dòng lệnh cơ bản của hệ thống BIOS"], correct: 2, explanation: "Trò chơi (phần mềm) cần HĐH làm môi trường chạy. Không có HĐH thì không thể mở được phần mềm." },
        { id: "1_26", type: "single", question: "Hầu hết các mẫu điện thoại thông minh, tivi thông minh hiện nay đều có giao diện khác nhau nhưng lại cùng chung một nguồn gốc lõi hệ điều hành. Lõi phổ biến đó là gì?", options: ["Lõi của hệ điều hành LINUX", "Lõi của hệ điều hành MS-DOS", "Lõi của hệ điều hành Windows", "Lõi của hệ điều hành macOS"], correct: 0, explanation: "Android và WebOS/Tizen trên Tivi đều được xây dựng dựa trên nhân (Kernel) của Linux." },
        { id: "1_27", type: "single", question: "Một học sinh sử dụng lệnh \"mkdir dulieu\" để tạo thư mục mới trên hệ thống thực hành. Học sinh này đang giao tiếp với hệ điều hành thông qua dạng giao diện nào?", options: ["Giao diện nhận diện thao tác cử chỉ", "Giao diện dòng lệnh truyền thống", "Giao diện cửa sổ đồ hoạ trực quan", "Giao diện nhận dạng qua giọng nói"], correct: 1, explanation: "Gõ lệnh bằng bàn phím (mkdir) là giao diện Command Line." },
        { id: "1_28", type: "single", question: "Hệ điều hành iOS và Android tích hợp sẵn các tiện ích quản lí sức khoẻ, định vị. Điều này phản ánh đặc thù gì của thiết bị di động?", options: ["Điện thoại di động có cấu hình xử lí mạnh gấp chục lần máy tính để bàn", "Thiết bị di động không có khả năng chạy các phần mềm của bên thứ ba", "Thiết bị di động là vật dụng cá nhân luôn gắn liền với sinh hoạt con người", "Hệ điều hành di động không thể tự kết nối mạng nếu thiếu các tiện ích này"], correct: 2, explanation: "Thiết bị mang tính cá nhân hoá cao nên ưu tiên các tiện ích gắn chặt với cá nhân." },
        { id: "1_II_1", type: "tf_cluster", context: "Cô Huyền Sinh đang hướng dẫn học sinh lớp 11 trường THPT Phan Đình Phùng truy cập vào website giáo dục \"Hành Trình Số\" để ôn tập. Để giải thích về sự vận hành trơn tru của máy tính cá nhân khi truy cập web, cô đưa ra các nhận định về nhóm chức năng của hệ điều hành. Hãy đánh giá tính ĐÚNG/SAI của các phát biểu sau:", items: [
            { id: "a", text: "a) Một trong những nhóm chức năng cốt lõi của hệ điều hành là cung cấp môi trường giao tiếp trực quan giữa học sinh và hệ thống máy tính.", correct: true, expl: "Cung cấp giao diện là 1 trong 5 chức năng cơ bản của HĐH." },
            { id: "b", text: "b) Hệ điều hành hoàn toàn không có khả năng quản lí các thiết bị phần cứng (như CPU hay bộ nhớ), công việc này do chính phần mềm trình duyệt web tự đảm nhận.", correct: false, expl: "Quản lý thiết bị là chức năng số 1 của HĐH." },
            { id: "c", text: "c) Việc cung cấp tiện ích để định dạng đĩa, nén tệp hay kiểm tra kết nối mạng là một chức năng giúp học sinh nâng cao hiệu quả khai thác hệ thống máy tính.", correct: true, expl: "Đây là nhóm chức năng cung cấp tiện ích." },
            { id: "d", text: "d) Khi các em tải một tài liệu bài tập từ \"Hành Trình Số\" về máy, phần mềm duyệt web không tự điều khiển thẻ mạng wifi mà phải nhờ vào các dịch vụ phân luồng dữ liệu do hệ điều hành cung cấp.", correct: true, expl: "Mọi tương tác phần cứng đều phải thông qua API của HĐH." }
        ]},
        { id: "1_II_2", type: "tf_cluster", context: "Cô giáo Thu vừa nâng cấp hệ thống máy tính trên phòng thực hành và chuyển sang sử dụng một chiếc máy tính bảng mới để linh hoạt hơn trong việc quản lí lớp. Khi so sánh hai loại hệ điều hành này, cô ghi chú lại một số quan sát. Đánh giá tính ĐÚNG/SAI:", items: [
            { id: "a", text: "a) Hệ điều hành dành cho thiết bị di động (như máy tính bảng của cô) ưu tiên rất cao cho khả năng kết nối mạng không dây như wifi, 4G, 5G và bluetooth.", correct: true, expl: "Đúng tính chất đặc thù của di động." },
            { id: "b", text: "b) Hai hệ điều hành phổ biến nhất được sử dụng riêng cho máy tính cá nhân (PC/Laptop) hiện nay là iOS của Apple và Android của Google.", correct: false, expl: "Đây là 2 HĐH cho di động, PC là Windows và macOS." },
            { id: "c", text: "c) Vì máy tính bảng có màn hình nhỏ và cần sự cơ động, hệ điều hành của nó bắt buộc phải tích hợp giao diện nhận diện thao tác cảm ứng (vuốt, chạm) thay cho chuột máy tính.", correct: true, expl: "Phù hợp với đặc thù phần cứng cảm ứng." },
            { id: "d", text: "d) Cơ chế \"Plug & Play\" (cắm và chạy) là một bước phát triển độc quyền chỉ có trên thiết bị di động của cô Hà, trong khi máy tính cá nhân ở phòng thực hành hiện nay vẫn phải cài đặt phụ kiện hoàn toàn bằng đĩa CD.", correct: false, expl: "Plug&Play xuất phát từ Windows 95 trên PC." }
        ]},
        { id: "1_II_3", type: "tf_cluster", context: "Thầy Thành  đang giảng bài cho học sinh về sự tiến hóa của giao diện máy tính từ thời kì màn hình đen trắng đến nay. Trong bài giảng, thầy nhấn mạnh về những cột mốc của hệ điều hành. Đánh giá tính ĐÚNG/SAI:", items: [
            { id: "a", text: "a) Trong thời kì của hệ điều hành DOS, người dùng phải ghi nhớ và gõ cú pháp từng câu lệnh văn bản trên nền màn hình đen để máy tính thực thi.", correct: true, expl: "Giao diện dòng lệnh (CLI)." },
            { id: "b", text: "b) Sự ra đời của giao diện đồ hoạ (GUI) đã thay thế các dòng lệnh khô khan bằng việc sử dụng cửa sổ, biểu tượng hình ảnh và con trỏ chuột.", correct: true, expl: "Định nghĩa chuẩn của giao diện đồ họa." },
            { id: "c", text: "c) Hệ điều hành LINUX đã khởi đầu trào lưu phần mềm mã nguồn mở, cho phép cộng đồng tiếp cận mã nguồn để tự do sử dụng và phát triển thêm các biến thể.", correct: true, expl: "Linux và giấy phép nguồn mở đã thay đổi lịch sử phần mềm." },
            { id: "d", text: "d) Mặc dù hệ điều hành LINUX có đặc tính mã nguồn mở rất ưu việt trên máy tính, nhưng cho đến nay nó vẫn chưa thể tạo ra bất kì một biến thể hệ điều hành nào dùng cho thiết bị di động.", correct: false, expl: "Android là nền tảng di động số 1 hiện nay và được xây dựng trên lõi Linux." }
        ]},
        { id: "1_II_4", type: "tf_cluster", context: "Cô Thu phát hiện phần mềm trộn đề kiểm tra trên máy tính của mình không thể xuất tệp tin dữ liệu ra ổ cứng. Cô nghi ngờ có sự cố trong chuỗi quy trình: Phần cứng -> Hệ điều hành -> Phần mềm ứng dụng -> Người dùng. Đánh giá tính ĐÚNG/SAI:", items: [
            { id: "a", text: "a) Sơ đồ hệ thống thể hiện hệ điều hành đóng vai trò là một môi trường trung gian kết nối phần mềm trộn đề với ổ đĩa cứng của máy tính.", correct: true, expl: "HĐH là tầng trung gian." },
            { id: "b", text: "b) Ổ đĩa cứng (phần cứng) có khả năng tự động phân tích và hiểu được lệnh của phần mềm trộn đề mà không cần đến sự điều phối của hệ điều hành.", correct: false, expl: "Phần cứng không hiểu phần mềm, phải qua HĐH biên dịch." },
            { id: "c", text: "c) Khi phần mềm của cô Hồng ra lệnh \"Lưu tệp\", thực chất nó đang gọi một dịch vụ do hệ điều hành cung cấp để hệ điều hành chỉ đạo đĩa cứng ghi lại dữ liệu.", correct: true, expl: "Cơ chế API Request chuẩn mực." },
            { id: "d", text: "d) Nếu hệ điều hành gặp lỗi nghiêm trọng trong module quản lí lưu trữ tệp, dù ổ cứng vật lí của cô Hồng hoàn toàn khỏe mạnh, phần mềm trộn đề vẫn sẽ thất bại khi cố gắng xuất tệp ra ổ đĩa.", correct: true, expl: "Môi trường trung gian bị hỏng thì lệnh không thể truyền đi." }
        ]}
    ];

        { id: "2_20", type: "single", question: "Tính năng nhận diện tự động tắt màn hình khi người dùng áp điện thoại lên tai để nghe gọi được hệ điều hành xử lí thông qua công cụ nào?", options: ["Giao thức truyền tải siêu văn bản HTTP", "Các cụm cảm biến tiệm cận được tích hợp trên thiết bị", "Trình quản lí thư mục lưu trữ của hệ thống", "Ứng dụng bản đồ định vị toàn cầu GPS"], correct: 1, explanation: "Cảm biến tiệm cận (Proximity Sensor) là cốt lõi để nhận dạng hành vi này." },
        { id: "2_21", type: "single", question: "Để giúp người dùng khuyết tật về thị giác dễ dàng sử dụng máy tính, tính năng nhận dạng giọng nói đã được đưa vào Windows. Đây là sự phát triển của hệ điều hành theo hướng nào?", options: ["Tối ưu hoá mạng kết nối di động", "Trở thành hệ điều hành mã nguồn mở", "Cải thiện môi trường giao tiếp thân thiện", "Cung cấp tiện ích kiểm tra lỗi đĩa cứng"], correct: 2, explanation: "Giọng nói là một phương thức giao tiếp thân thiện (Accessibility/HCI)." },
        { id: "2_22", type: "single", question: "Hệ điều hành Android của Google (dùng cho điện thoại) và hệ điều hành Ubuntu (dùng cho máy tính) có chung một đặc điểm nền tảng quan trọng nào?", options: ["Đều có mức phí bản quyền sử dụng rất đắt đỏ", "Đều được phát triển dựa trên lõi của LINUX", "Đều không hỗ trợ kết nối mạng không dây Wifi", "Đều do tập đoàn Microsoft độc quyền phát triển"], correct: 1, explanation: "Cả 2 đều dùng Linux Kernel." },
        { id: "2_23", type: "single", question: "Nếu bộ nhớ RAM của máy tính bị đầy khi bạn đang mở cùng lúc 10 cửa sổ trình duyệt, hệ điều hành sẽ thực thi hành động nào sau đây để máy không bị treo hoàn toàn?", options: ["Ngừng cấp điện cho CPU để tắt máy ngay lập tức", "Điều phối tài nguyên, chuyển bớt một số dữ liệu tạm thời sang bộ nhớ đĩa cứng", "Tự động xoá toàn bộ dữ liệu vĩnh viễn trên máy tính để giải phóng không gian", "Gọi điện trực tiếp cho chuyên viên kĩ thuật qua mạng lưới hỗ trợ trực tuyến"], correct: 1, explanation: "HĐH sẽ dùng kĩ thuật Page file (hoặc Swap) đẩy dữ liệu tạm xuống ổ cứng." },
        { id: "2_24", type: "single", question: "Khi chơi một tựa game đua xe trên điện thoại thông minh, việc bạn nghiêng điện thoại sang trái/phải để điều khiển xe là nhờ hệ điều hành đang thực hiện chức năng nào?", options: ["Xử lí thông tin định vị toàn cầu GPS", "Quản lí chức năng bảo mật khuôn mặt", "Giao tiếp qua khả năng nhận dạng hành vi bằng cảm biến gia tốc", "Kết nối với hệ thống thanh toán qua giao tiếp gần NFC"], correct: 2, explanation: "Cảm biến gia tốc (Accelerometer) là linh kiện ghi nhận độ nghiêng vật lí." },
        { id: "2_25", type: "single", question: "Trong quá trình học, một giáo viên nhận thấy có quá nhiều thiết bị ngoại vi kết nối vào máy tính khiến hệ thống báo lỗi không nhận diện được. Giải pháp xử lí của hệ điều hành nhờ vào cơ chế nào?", options: ["Cơ chế kiểm tra đĩa Check Disk", "Cơ chế Plug & Play tự động quét và nhận biết phần cứng", "Cơ chế mã nguồn mở phân quyền người dùng", "Cơ chế nén dữ liệu dung lượng lớn"], correct: 1, explanation: "Plug&Play chịu trách nhiệm phân dải địa chỉ và driver cho linh kiện gắn ngoài." },
        { id: "2_26", type: "single", question: "Khi bạn sử dụng thẻ từ hoặc điện thoại thông minh chạm vào máy POS để thanh toán tại siêu thị, chức năng kết nối nào của hệ điều hành đang được ứng dụng?", options: ["Chức năng kết nối cáp quang biển", "Chức năng kết nối giao tiếp gần NFC", "Chức năng chia sẻ tệp tin qua giao thức FTP", "Chức năng quản lí danh bạ liên lạc nội bộ"], correct: 1, explanation: "NFC (Near Field Communication) ứng dụng chính trong thanh toán một chạm." },
        { id: "2_27", type: "single", question: "Một sinh viên muốn xây dựng chương trình quản lí thư viện. Thay vì phải viết mã lệnh kiểm soát việc lưu từng byte chữ vào đĩa cứng, sinh viên này sẽ sử dụng công cụ gì của hệ điều hành?", options: ["Các dịch vụ ghi/đọc tệp do hệ điều hành cung cấp sẵn (API)", "Công cụ dồn mảnh đĩa cứng Defragmentation", "Bộ mã hóa âm thanh kĩ thuật số thành chuẩn MP3", "Trình quản lí bảo mật tưởng lửa (Firewall) của Windows"], correct: 0, explanation: "Dev dùng API của HĐH để tương tác dễ dàng." },
        { id: "2_28", type: "single", question: "Việc hệ điều hành iOS tích hợp sẵn các tiện ích cá nhân như đo đếm số bước chân, theo dõi giấc ngủ, và phân tích sức khoẻ cho thấy định hướng thiết kế nào so với máy tính cá nhân truyền thống?", options: ["Biến thiết bị di động thành một siêu máy chủ tính toán dữ liệu lớn", "Thiết bị di động tập trung cao vào các tiện ích hỗ trợ cá nhân hóa đời sống", "Khuyến khích người dùng không sử dụng các phần mềm tải thêm từ App Store", "Ngăn chặn triệt để sự phát triển của các thiết bị y tế chuyên dụng"], correct: 1, explanation: "Smartphone thiết kế để làm phụ kiện gắn bó sâu với chủ thể con người." },
        { id: "2_II_1", type: "tf_cluster", context: "Để chuẩn bị cho kì kiểm tra trên hệ thống \"Hành Trình Số\", các học sinh lớp 11A đang ôn tập về các chức năng và cấu trúc của hệ điều hành. Các bạn cùng thảo luận và đưa ra các ý kiến. Đánh giá tính ĐÚNG/SAI:", items: [
            { id: "a", text: "a) Windows là hệ điều hành do Microsoft phát triển và là hệ điều hành máy tính cá nhân được sử dụng phổ biến nhất hiện nay.", correct: true, expl: "Windows chiếm đa số thị phần PC toàn cầu." },
            { id: "b", text: "b) Linux là hệ điều hành thuộc nhóm mã nguồn đóng, nhà trường bắt buộc phải trả chi phí rất cao mới được cài đặt lên phòng thực hành.", correct: false, expl: "Linux là mã nguồn mở và miễn phí." },
            { id: "c", text: "c) Ubuntu, một biến thể nổi tiếng của Linux, cung cấp cho người dùng một hệ điều hành đáng tin cậy với chi phí thấp và được cộng đồng hỗ trợ phát triển mạnh mẽ.", correct: true, expl: "Phát biểu chính xác về Ubuntu." },
            { id: "d", text: "d) Nếu bài tập yêu cầu tính minh bạch cao, cần kiểm tra và can thiệp sâu vào cấu trúc mã lệnh phần mềm hệ thống, học sinh nên ưu tiên sử dụng hệ điều hành mã nguồn mở Linux thay vì Windows.", correct: true, expl: "Mã nguồn mở (Open Source) cho phép xem và sửa source code." }
        ]},
        { id: "2_II_2", type: "tf_cluster", context: "Thầy Thành vừa trang bị một chiếc máy tính bảng mới để thuận tiện hơn trong việc chấm bài và theo dõi kết quả học tập thay vì dùng laptop. Thầy chia sẻ với tổ chuyên môn về những điểm khác biệt của hệ điều hành di động. Đánh giá tính ĐÚNG/SAI:", items: [
            { id: "a", text: "a) Giao diện của hệ điều hành trên máy tính bảng được thiết kế đặc biệt thân thiện, ưu tiên các thao tác qua màn hình cảm ứng thay vì dùng chuột cơ học.", correct: true, expl: "Đặc trưng của Tablet OS." },
            { id: "b", text: "b) Điện thoại thông minh và máy tính bảng thực chất không được xếp vào nhóm các thiết bị máy tính cá nhân vì chúng không chạy hệ điều hành DOS.", correct: false, expl: "Smartphone/Tablet vẫn được phân loại chung là Máy tính cá nhân (Personal Computer)." },
            { id: "c", text: "c) Không giống như máy tính để bàn truyền thống, hệ điều hành di động rất chú trọng đến khả năng kết nối mạng không dây và hỗ trợ hàng loạt tiện ích cá nhân như định vị bản đồ.", correct: true, expl: "Điểm đặc thù của Mobile OS." },
            { id: "d", text: "d) Nhờ hệ điều hành tích hợp sâu các cảm biến định vị (GPS), chiếc máy tính bảng có thể cung cấp dịch vụ điều hướng và dẫn đường trực tiếp cho thầy trong các chuyến công tác xa.", correct: true, expl: "Phát biểu chính xác về công năng của cảm biến GPS." }
        ]},
        { id: "2_II_3", type: "tf_cluster", context: "Trong một buổi sinh hoạt chuyên môn tại THPT Phan Đình Phùng, các giáo viên bàn về việc lựa chọn hệ điều hành phù hợp để cải tiến phòng máy thực hành. Đánh giá tính ĐÚNG/SAI của các phát biểu về sự phát triển của hệ điều hành:", items: [
            { id: "a", text: "a) Ở thời kì của hệ điều hành DOS, người dùng thao tác bằng cách ghi nhớ và gõ cú pháp từng câu lệnh văn bản trên nền màn hình đen.", correct: true, expl: "Đặc điểm của giao diện DOS." },
            { id: "b", text: "b) Sự ra đời của giao diện đồ hoạ (GUI) đã thay thế các dòng lệnh bằng việc sử dụng hệ thống cửa sổ, biểu tượng hình ảnh và con trỏ chuột.", correct: true, expl: "Khái niệm WIMP." },
            { id: "c", text: "c) Một trong những lí do khiến giao diện đồ hoạ thành công vang dội là vì nó đòi hỏi kĩ năng lập trình phần mềm cao hơn rất nhiều từ phía người sử dụng.", correct: false, expl: "GUI thành công vì nó DỄ SỬ DỤNG, không đòi hỏi kĩ năng." },
            { id: "d", text: "d) Việc học sinh hiện nay có thể thu nhỏ nhiều \"cửa sổ\" để vừa tra cứu tài liệu vừa gõ văn bản là thành tựu bắt nguồn trực tiếp từ tính năng đa nhiệm (multitasking) ra mắt từ các thế hệ Windows 3.0.", correct: true, expl: "Windows 3.0 đánh dấu việc hỗ trợ ứng dụng đa nhiệm (cooperative multitasking)." }
        ]},
        { id: "2_II_4", type: "tf_cluster", context: "Khi giảng về nguyên lí hoạt động của máy tính, cô Huyền vẽ một sơ đồ 4 tầng: Phần cứng -> Hệ điều hành -> Phần mềm ứng dụng -> Người dùng. Cô đặt ra các tình huống để học sinh phân tích. Đánh giá tính ĐÚNG/SAI:", items: [
            { id: "a", text: "a) Sơ đồ thể hiện hệ điều hành hoạt động như một môi trường trung gian kết nối giữa phần mềm ứng dụng và các thiết bị phần cứng của máy tính.", correct: true, expl: "Đúng theo vị trí phân tầng hệ thống." },
            { id: "b", text: "b) Các thiết bị điện tử càng đa năng (như máy tính xách tay) thì càng không cần sử dụng đến hệ điều hành vì chúng có thể tự phân bổ bộ nhớ lưu trữ.", correct: false, expl: "Máy càng đa năng thì càng cần hệ điều hành quản lý tài nguyên phức tạp." },
            { id: "c", text: "c) Khi phần mềm gõ văn bản ra lệnh \"Lưu tệp\", thực chất nó đang gọi một dịch vụ do hệ điều hành cung cấp để hệ điều hành điều khiển đĩa cứng ghi lại dữ liệu.", correct: true, expl: "Software gọi OS API để thao tác đĩa." },
            { id: "d", text: "d) Nếu hệ điều hành gặp sự cố trong module quản lí bộ nhớ, dù đĩa cứng vật lí hoàn toàn khỏe mạnh, phần mềm gõ văn bản vẫn sẽ thất bại khi cố gắng xuất tệp ra ngoài.", correct: true, expl: "HĐH lỗi thì không thể truyền lệnh từ app xuống phần cứng." }
        ]}
    ];

    const testBanks = { de1: de1_data, de2: de2_data };
    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;

    window.startQuizAction = function() {
        try {
            const errDiv = document.getElementById('login-error');
            if(errDiv) errDiv.classList.add('hidden');
            
            const nameEl = document.getElementById('hoTen');
            const lopEl = document.getElementById('lop');
            
            if (!nameEl || !lopEl) return;
            
            const name = nameEl.value.trim();
            const lop = lopEl.value.trim();
            const checkedRadio = document.querySelector('input[name="chonDe"]:checked');
            
            if (!name || !lop) {
                if(errDiv) {
                    errDiv.innerText = "⚠️ Các em học sinh nhớ nhập đầy đủ Họ tên và Lớp nhé!";
                    errDiv.classList.remove('hidden');
                } else alert("⚠️ Nhập đầy đủ Họ tên và Lớp!");
                return;
            }
            
            if (name && lop && checkedRadio) {
                const maDe = checkedRadio.value;
                const tenDe = checkedRadio.nextElementSibling.querySelector('.de-text').innerText.split('\n')[0].trim();
                currentStudent = { hoTen: name, lop: lop, maDe: maDe, tenDe: tenDe };
                currentQuestions = JSON.parse(JSON.stringify(testBanks[maDe]));
                quizStartTime = new Date();
                
                setTimeout(() => { isQuizStarted = true; }, 1000);
                showSection('quiz');
                
                const titleEl = document.getElementById('quiz-title');
                const infoEl = document.getElementById('student-info');
                if (titleEl) titleEl.innerText = currentStudent.tenDe;
                if (infoEl) infoEl.innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
                
                currentIdx = 0;
                userAnswers = {};
                window.renderQuestion();
                startTimer(45 * 60); 
            }
        } catch (error) { console.error(error); }
    };

    window.prevQuestion = function() { if (currentIdx > 0) { currentIdx--; window.renderQuestion(); } };
    window.nextQuestion = function() { if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); } };

    window.viewScoresAction = function() {
        const btn = document.getElementById('view-scores-btn') || document.createElement('button'); 
        btn.innerText = "⏳ Đang tải dữ liệu...";
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                window.renderScores();
                btn.innerText = "🏆 Xem bảng xếp hạng";
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        if(document.getElementById('hoTen')) document.getElementById('hoTen').value = ''; 
        if(document.getElementById('lop')) document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalScoreItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.items.length;
            else count += 1;
        });
        return count; 
    }

    function getAnsweredCount() { return Object.keys(userAnswers).length; }


   window.selectAnswer = function(qId, val, type) {
        if (type === 'tf') {
            if (userAnswers[qId] !== undefined) return; // Thêm dòng này để chặn học sinh bấm lại nhiều lần
            
            userAnswers[qId] = val;
            window.updateProgress();
            window.renderQuestion();
            const parts = qId.split('_'); 
            const mainQId = parts.slice(0, parts.length - 1).join('_'); 
            const itemId = parts[parts.length - 1]; 
            const q = currentQuestions.find(i => i.id === mainQId);
            const item = q.items.find(i => i.id === itemId);
            window.showFeedbackModal(item, val, 'tf');
        } else if (type === 'single') {
            if (userAnswers[qId] !== undefined) return;
            userAnswers[qId] = val;
            window.updateProgress();
            window.renderQuestion();
            const q = currentQuestions[currentIdx];
            window.showFeedbackModal(q, val, 'single');
        }
    };


    window.showFeedbackModal = function(qOrItem, uAns, type = 'single') {
        const modal = document.getElementById('feedback-modal');
        const content = document.getElementById('feedback-modal-content');
        const header = document.getElementById('feedback-header');
        const body = document.getElementById('feedback-body');
        
        if(!modal || !content) return; 

        let isCorrect = false; let correctOptText = ''; let userChoiceText = '';
        let explanation = qOrItem.explanation || qOrItem.expl || "Chưa có lời giải chi tiết.";

        if (type === 'single') {
            isCorrect = (uAns === qOrItem.correct);
            correctOptText = qOrItem.options[qOrItem.correct];
            userChoiceText = String.fromCharCode(65 + uAns);
        } else if (type === 'tf') {
            isCorrect = (uAns === qOrItem.correct);
            correctOptText = qOrItem.correct ? "ĐÚNG" : "SAI";
            userChoiceText = uAns ? "ĐÚNG" : "SAI";
        }
        
        let bgColor = isCorrect ? 'emerald' : 'red';
        let statusTitle = isCorrect ? 'Chính xác!' : 'Bạn làm sai rồi!';
        let emoji = isCorrect ? '🎉' : '💡';

        header.innerHTML = `<div class="text-6xl mb-4 animate-bounce">${emoji}</div><h3 class="text-3xl font-black text-${bgColor}-600 uppercase tracking-widest drop-shadow-sm">${statusTitle}</h3>`;
        
        body.innerHTML = `<p class="mb-4 text-${bgColor}-800 text-xl font-bold text-center">Em đã chọn: <span class="bg-${bgColor}-100 text-${bgColor}-700 px-3 py-1 rounded-lg">${userChoiceText}</span></p>
                          <div class="p-5 bg-white border-4 border-${bgColor}-100 rounded-2xl shadow-inner mt-4 text-center">
                              <p class="text-${bgColor}-700 font-extrabold text-lg mb-2">ĐÁP ÁN CHUẨN LÀ:</p>
                              <p class="text-2xl text-black drop-shadow-sm font-black">${correctOptText}</p>
                          </div>`;
        
        body.innerHTML += `<div class="mt-6"><div class="inline-block bg-blue-100 text-blue-800 px-4 py-2 rounded-t-xl font-black uppercase text-sm border-b-4 border-blue-500">📖 Giải chi tiết:</div><div class="p-5 bg-white border-2 border-blue-200 rounded-b-2xl rounded-tr-2xl shadow-sm text-black font-medium text-base md:text-lg leading-loose math-scroll">${explanation}</div></div>`;

        modal.classList.remove('hidden');
        void modal.offsetWidth;
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
    };

    window.closeFeedbackModal = function() {
        const modal = document.getElementById('feedback-modal');
        const content = document.getElementById('feedback-modal-content');
        if(!modal) return;
        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        if(!container) return;

        let html = `<div class="fade-in w-full">`;
        
        if (q.type === 'single') {
            const hasAnswered = userAnswers[q.id] !== undefined;
            const uAns = userAnswers[q.id];
            
            html += `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">CÂU HỎI TRẮC NGHIỆM</h3></div>`;
            html += `<div class="flex gap-4 mb-5"><div class="w-full math-scroll"><p class="text-lg sm:text-xl font-bold text-red-600 mt-1 leading-snug tracking-tight"><span class="text-blue-600">Câu ${currentIdx + 1}:</span> ${q.question}</p></div></div>`;
            html += `<div class="space-y-4 md:pl-6 mt-6">`;
            q.options.forEach((opt, i) => {
                const isChecked = (uAns === i) ? 'checked' : '';
                const disabledClass = hasAnswered ? 'disabled-option' : '';
                html += `<div class="flex items-center">
                    <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${isChecked} ${hasAnswered ? 'disabled' : ''} onchange="window.selectAnswer('${q.id}', ${i}, 'single')">
                    <label for="opt_${i}" class="option-label ${disabledClass} w-full p-4 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-bold text-lg cursor-pointer">
                        <div class="w-10 h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-base font-black text-gray-400 flex-shrink-0 bg-gray-50">${String.fromCharCode(65 + i)}</div>
                        <div class="text-gray-700 leading-relaxed math-scroll flex-1">${opt}</div>
                    </label>
                </div>`;
            });
            html += `</div>`;
            
        } 
        else if (q.type === 'tf_cluster') {
            html += `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span><h3 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">TRẮC NGHIỆM ĐÚNG/SAI</h3></div>`;
            html += `<div class="bg-red-50 text-red-700 p-4 rounded-xl font-bold mb-4 border-2 border-red-100 text-lg sm:text-xl leading-relaxed math-scroll"><span class="text-blue-600">Câu ${currentIdx + 1}:</span> ${q.context}</div>`;
            html += `<div class="space-y-3 mt-6">`;
           q.items.forEach((item) => {
                const combinedId = q.id + '_' + item.id;
                let ans = userAnswers[combinedId];
                
                // Kiểm tra xem ý này đã được trả lời chưa
                let hasAnswered = ans !== undefined; 
                
                let btnT = ans === true ? 'selected' : ''; 
                let btnF = ans === false ? 'selected' : ''; 
                
                // Thêm thuộc tính khóa và làm mờ nút nếu đã trả lời
                let disabledAttr = hasAnswered ? 'disabled' : '';
                let disabledClass = hasAnswered ? 'opacity-50 cursor-not-allowed' : '';

                html += `<div class="p-4 sm:p-5 border-2 border-gray-100 rounded-2xl bg-white shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all hover:border-blue-200">
                    <div class="font-bold text-gray-800 flex-1 text-base sm:text-lg math-scroll">${item.text}</div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="window.selectAnswer('${combinedId}', true, 'tf')" class="btn-tf w-20 sm:w-24 py-2 sm:py-3 rounded-xl font-extrabold ${btnT} ${disabledClass}" ${disabledAttr}>ĐÚNG</button>
                        <button onclick="window.selectAnswer('${combinedId}', false, 'tf')" class="btn-tf w-20 sm:w-24 py-2 sm:py-3 rounded-xl font-extrabold ${btnF} ${disabledClass}" ${disabledAttr}>SAI</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
        } 
        html += `</div>`;
        container.innerHTML = html;
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        const pBtn = document.getElementById('prev-btn');
        const nBtn = document.getElementById('next-btn');
        const sBtn = document.getElementById('submit-btn');
        if(pBtn) pBtn.style.display = (currentIdx === 0) ? 'none' : 'block';
        if(nBtn) nBtn.style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        if(sBtn) sBtn.style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        const pgText = document.getElementById('progress-text');
        if(pgText) pgText.innerText = `${getAnsweredCount()}/${getTotalScoreItems()}`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        quizEndTime = new Date();
        clearInterval(timerInterval);
        
        let score = 0;
        let totalMax = 11; // 28 * 0.25 (7) + 4 * 1.0 (4) = 11 Điểm.
        // Quy đổi ra thang 10
        
        let rawScore = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'single') {
                if (userAnswers[q.id] === q.correct) rawScore += 0.25;
            } else if (q.type === 'tf_cluster') {
                let c = 0;
                q.items.forEach(item => { if (userAnswers[q.id + '_' + item.id] === item.correct) c++; });
                if (c === 1) rawScore += 0.1;
                else if (c === 2) rawScore += 0.25;
                else if (c === 3) rawScore += 0.5;
                else if (c === 4) rawScore += 1.0;
            }
        });

        score = ((rawScore / totalMax) * 10).toFixed(2); 

        const record = {
            hoTen: currentStudent.hoTen, 
            lop: currentStudent.lop, 
            tenDe: currentStudent.tenDe, 
            maDe: currentStudent.maDe,
            diem: parseFloat(score),
            startTime: quizStartTime.toLocaleTimeString('vi-VN'), 
            startDate: quizStartTime.toLocaleDateString('vi-VN'),
            endTime: quizEndTime.toLocaleTimeString('vi-VN'),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), 
            deviceId: deviceId,
            answers: userAnswers // Lưu lại đáp án của học sinh
        };
        
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, record.duration); });
        } else {
            window.showModalResult(score, record.duration);
        }
    };

    window.showModalResult = function(score, dur) {
        ['login', 'quiz', 'scores', 'review'].forEach(s => {
            const el = document.getElementById(s+'-section');
            if(el) el.classList.add('hidden');
        });
        const resEl = document.getElementById('result-section');
        if(resEl) resEl.classList.remove('hidden');
        const contentEl = document.getElementById('result-content');
        
        // Cập nhật tiêu đề trang xem lại theo học sinh hiện tại
        const reviewTitle = document.getElementById('review-title');
        if (reviewTitle) reviewTitle.innerText = `👀 Bài làm của: ${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;

        if(contentEl) contentEl.innerHTML = `
        <div class="flex justify-start mb-2">
            <button onclick="window.goHome()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors shadow-sm border border-gray-200 text-sm">🏠 Trang chủ</button>
        </div>
        <div class="text-center">
            <div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div>
            <h3 class="text-2xl sm:text-3xl font-black text-emerald-600 mb-2">Hoàn thành bài thi!</h3>
            <p class="text-gray-600 mb-6 mt-2"><span class="font-extrabold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-bold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p>
        </div>
        <div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative text-center">
            <div class="text-sm text-blue-500 font-extrabold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div>
            <div class="text-6xl sm:text-7xl font-black text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div>
            <div class="text-base sm:text-lg font-extrabold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm border border-blue-100">Thời gian làm bài: ${dur}</div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
            <button onclick="window.reviewQuiz()" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-xl font-extrabold shadow-sm hover:shadow-md transition-colors text-lg">👀 Xem lại & Giải chi tiết</button>
            <button onclick="window.viewScoresAction()" class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-extrabold shadow-sm hover:shadow-md transition-colors text-lg">🏆 Bảng điểm</button>
        </div>`;
    };

    // Hàm gọi khi ấn nút Xem lại từ bảng điểm
    window.viewStudentReview = function(id) {
        const record = allScores.find(s => s.id === id);
        if (!record) return;
        
        if (!record.answers) {
            alert("Bài làm này thuộc phiên bản cũ, không có dữ liệu đáp án chi tiết để xem lại!");
            return;
        }

        currentQuestions = JSON.parse(JSON.stringify(testBanks[record.maDe || 'de1']));
        userAnswers = record.answers;
        
        const reviewTitle = document.getElementById('review-title');
        if (reviewTitle) reviewTitle.innerText = `👀 Bài làm của: ${record.hoTen} - Lớp ${record.lop}`;
        
        window.reviewQuiz();
    };

    window.reviewQuiz = function() {
        showSection('review');
        const container = document.getElementById('review-content');
        if(!container) return;
        let html = '';

        currentQuestions.forEach((q, idx) => {
            if (q.type === 'single') {
                let uAns = userAnswers[q.id];
                let isCorrect = uAns === q.correct;
                let borderColor = isCorrect ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50';
                
                html += `<div class="p-4 sm:p-6 border-2 rounded-2xl shadow-sm mb-6 ${borderColor}">`;
                html += `<div class="font-bold text-lg sm:text-xl text-red-600 mb-4 leading-relaxed math-scroll"><span class="text-blue-600">Câu ${idx + 1}:</span> ${q.question}</div>`;
                html += `<div class="space-y-2">`;
                
                q.options.forEach((opt, i) => {
                    let optBg = ''; let iconHtml = '';
                    if (q.correct === i) {
                        optBg = 'bg-emerald-100 text-emerald-900 border-emerald-400 border-2'; 
                        iconHtml = '<div class="text-2xl drop-shadow-sm ml-auto pl-2 flex-shrink-0">✅</div>';
                    } else if (uAns === i && !isCorrect) {
                        optBg = 'bg-red-100 text-red-900 line-through border-red-400 border-2'; 
                        iconHtml = '<div class="text-2xl drop-shadow-sm ml-auto pl-2 flex-shrink-0">❌</div>';
                    } else { optBg = 'bg-white text-slate-700 border border-slate-200'; }

                    html += `<div class="p-3 rounded-xl ${optBg} flex items-center gap-3"><div class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/50 text-sm font-black shadow-sm flex-shrink-0">${String.fromCharCode(65 + i)}</div><div class="${(q.correct === i || uAns === i) ? 'font-semibold' : 'font-medium'} flex-1 math-scroll">${opt}</div>${iconHtml}</div>`;
                });
                html += `</div>`;
                if (q.explanation) html += `<div class="review-explanation mt-4 pt-4 border-t-2 border-gray-200"><p class="text-sm font-black uppercase tracking-widest text-blue-600 mb-2">💡 Giải chi tiết:</p><p class="text-black font-medium text-base leading-loose math-scroll">${q.explanation}</p></div>`;
                html += `</div>`;
            } 
            else if (q.type === 'tf_cluster') {
                html += `<div class="p-4 sm:p-6 border-2 border-indigo-200 bg-indigo-50 rounded-2xl shadow-sm mb-6">`;
                html += `<div class="font-bold text-lg sm:text-xl text-indigo-800 mb-4 math-scroll"><span class="text-blue-600">Câu ${idx + 1}:</span> ${q.context}</div>`;
                html += `<div class="space-y-4">`;
                q.items.forEach(item => {
                    let uAns = userAnswers[q.id + '_' + item.id];
                    let isCorrect = uAns === item.correct;
                    let iconHtml = isCorrect ? '✅' : '❌';
                    let ansText = item.correct ? 'ĐÚNG' : 'SAI';

                    html += `<div class="p-4 bg-white border border-indigo-100 rounded-xl shadow-sm">
                        <div class="font-bold text-gray-800 math-scroll">${item.text}</div>
                        <div class="mt-2 flex items-center justify-between border-b border-gray-100 pb-2">
                            <span class="text-sm font-bold text-gray-500">Bạn chọn: <span class="${uAns === undefined ? 'text-gray-400' : 'text-blue-600'} font-black uppercase">${uAns === undefined ? 'Chưa trả lời' : (uAns?'Đúng':'Sai')}</span></span>
                            <span class="font-black text-lg ${isCorrect ? 'text-emerald-500' : 'text-red-500'}">Đáp án chuẩn: ${ansText} ${iconHtml}</span>
                        </div>
                        <div class="review-explanation mt-2 pt-2 text-sm text-gray-700 font-medium leading-relaxed math-scroll"><span class="text-indigo-500 font-bold uppercase">Giải thích:</span><br> ${item.expl}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }
        });
        container.innerHTML = html;
    };

    window.backToResult = function() { showSection('scores'); };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        if(!tbody) return;
        if (allScores.length === 0) { tbody.innerHTML = ''; document.getElementById('no-scores').classList.remove('hidden'); return; }
        const noScore = document.getElementById('no-scores');
        if(noScore) noScore.classList.add('hidden');
        
        const sorted = [...allScores].sort((a, b) => (a.lop.localeCompare(b.lop)) || (b.diem - a.diem));
        
        tbody.innerHTML = sorted.map((s, idx) => `
            <tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-slate-50'} transition-colors border-b border-slate-100">
                <td class="px-4 py-4 text-center font-black text-slate-400 text-sm">#${idx + 1}</td>
                <td class="px-4 py-4 font-black text-blue-600 text-sm">${s.lop}</td>
                <td class="px-4 py-4 font-extrabold text-slate-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-4 py-4 text-xs font-bold text-blue-500"><span class="bg-blue-50 border border-blue-100 px-2 py-1 rounded-md">${s.tenDe}</span></td>
                <td class="px-4 py-4 text-center"><span class="font-black text-lg ${s.diem >= 5 ? 'text-emerald-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-4 py-4 text-center text-slate-500 text-xs font-bold leading-tight">${s.startTime} <br> <span class="text-[10px] text-gray-400">${s.startDate || '--/--/----'}</span></td>
                <td class="px-4 py-4 text-center font-black text-orange-600 text-xs">${s.duration}</td>
                <td class="px-4 py-4 text-center">
                    <button onclick="window.viewStudentReview('${s.id}')" class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-200 transition-colors text-xs shadow-sm whitespace-nowrap">👀 Xem lại</button>
                </td>
            </tr>`).join('');
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result', 'review'].forEach(s => {
            const el = document.getElementById(s+'-section');
            if(el) el.classList.add('hidden');
        });
        const tgt = document.getElementById(id+'-section');
        if(tgt) tgt.classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        if(!display) return;
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
